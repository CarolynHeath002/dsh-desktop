name: Package Desktop · Windows

on:
  workflow_dispatch:
    inputs:
      preset:
        description: '打包环境：选择机器上的 test 或 production 配置；同时决定后续发布环境'
        type: choice
        options: [test, production]
        default: test
        required: true
      signing:
        description: '签名方式：unsigned 仅限内部调试，禁止发布到 test / production 或用于自动更新；需要发布请选择 signed（EV 硬件令牌）'
        type: choice
        options: [signed, unsigned]
        default: unsigned
        required: true
      test_release_id:
        description: '测试 release ID：32 位小写十六进制随机前缀（非鉴权）；留空使用机器默认值，连续升级测试须保持相同值'
        type: string
        default: ''
        required: false
      source_ref:
        description: '打包源码：test 支持仓库内分支或 dsh-v* tag；production 仅支持 master 或 dsh-v* tag；源码须包含 CI 适配脚本'
        type: string
        default: hardened
        required: true
      update_channel:
        description: '升级通道：nightly 或 latest（须为稳定版本）；自动更新不会切换通道'
        type: choice
        options: [nightly, latest]
        default: nightly
        required: true
      version_mode:
        description: '版本模式：default 为 test 自动编号、production 跟随产品；product 保留原版本，auto 自动编号，manual 手填'
        type: choice
        options: [default, product, auto, manual]
        default: default
        required: true
      build_version:
        description: '手动版本号：仅 manual 时填写完整版本；须为产品原版本或受支持的预发布后缀'
        type: string
        default: ''
        required: false
      publish_release:
        description: '发布 Release：打包成功后将安装包发布为 GitHub Release（tag v<版本号>，未签名构建自动标记 prerelease）'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: windows-desktop-package
  cancel-in-progress: false

jobs:
  package:
    # The fork builds on GitHub-hosted runners; upstream routes this workflow to
    # its self-hosted `dsh-win-package-trial` label, which does not exist here.
    # The dispatch-only guard also keeps modified-workflow pushes from running it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_SOURCE_REF: ${{ inputs.source_ref }}
      PACKAGE_VERSION_MODE: ${{ inputs.version_mode }}
      DSH_DESKTOP_UPDATE_CHANNEL: ${{ inputs.update_channel }}
      DSH_TELEMETRY_DISABLED: '1'
      DSH_PACKAGING_PRESET: ${{ inputs.preset }}
      DSH_PACKAGING_CONFIG_DIR: ${{ github.workspace }}\apps\desktop
      PACKAGE_TEST_RELEASE_ID: ${{ inputs.test_release_id }}
      PACKAGE_SIGNING: ${{ inputs.signing }}
    outputs:
      version: ${{ steps.settings.outputs.version }}
      sha: ${{ steps.checkout.outputs.commit }}
      artifact: windows-x64-${{ inputs.signing == 'unsigned' && 'unsigned' || 'signed' }}-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Reset packaging checkout
        working-directory: ${{ runner.temp }}
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $parent = [IO.Path]::GetFullPath($env:RUNNER_WORKSPACE)
          if ([IO.Path]::GetDirectoryName($workspace) -ne $parent) { throw 'Checkout must be a direct child of RUNNER_WORKSPACE' }
          for ($item = [IO.DirectoryInfo]::new($workspace); $null -ne $item; $item = $item.Parent) {
            if ($item.Exists -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Checkout ancestors cannot be links' }
          }
          node -e "const fs = require('node:fs'); fs.rmSync(process.argv[1], { recursive: true, force: true, maxRetries: 3 }); fs.mkdirSync(process.argv[1])" $workspace
          if ($LASTEXITCODE -ne 0) { throw 'Checkout cleanup failed' }
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true
          ref: ${{ inputs.source_ref }}
      - name: Validate selected source and adapter support
        run: >-
          node -e "const fs=require('node:fs'); const ref=process.env.PACKAGE_SOURCE_REF;
          const cp=require('node:child_process'); const preset=process.env.DSH_PACKAGING_PRESET;
          if(!['test','production'].includes(preset)) throw Error('Unknown packaging preset');
          const tag=/^dsh-v[0-9][0-9A-Za-z.-]*$/.test(ref);
          if(preset==='production' && ref!=='master' && !tag) throw Error('Production source must be master or dsh-v*');
          if(tag) {
          const v=JSON.parse(fs.readFileSync('package.json','utf8')).version;
          if(ref!=='dsh-v'+v) throw Error('Source tag must match product version');
          const tagged=cp.execFileSync('git',['rev-parse','--verify','refs/tags/'+ref+'^{commit}'],{encoding:'utf8'}).trim();
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(tagged!==head) throw Error('Checkout does not match source tag');
          } else {
          const branch=cp.execFileSync('git',['rev-parse','--abbrev-ref','HEAD'],{encoding:'utf8'}).trim();
          if(branch==='HEAD' || branch!==ref || ref.startsWith('refs/')) throw Error('Select a branch in this repository, not a SHA or PR ref');
          }
          if(!fs.readFileSync('apps/desktop/scripts/desktop-ci-version.mjs','utf8').includes('PACKAGE_VERSION_MODE')) throw Error('Source lacks Desktop channel/version CI support; select a newer release');"
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Validate preset and resolve build version
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
        run: node apps/desktop/scripts/prepare-windows-ci.mjs
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          $packageArgs = @('run', 'package:desktop:win:x64', '--check', '--build-version', $env:PACKAGE_VERSION)
          if ($env:PACKAGE_SIGNING -eq 'unsigned') { $packageArgs += '--unsigned' }
          pnpm @packageArgs
          exit $LASTEXITCODE
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          $packageArgs = @('run', 'package:desktop:win:x64', '--build-version', $env:PACKAGE_VERSION)
          if ($env:PACKAGE_SIGNING -eq 'unsigned') { $packageArgs += '--unsigned' }
          pnpm @packageArgs
          exit $LASTEXITCODE
      - name: Retain complete package outside the checkout
        id: retained
        env:
          PACKAGE_SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
          # The releases root must sit outside the checkout; step env is the
          # only level where the runner context is available.
          DSH_DESKTOP_RELEASES_DIR: ${{ runner.temp }}\releases
        run: node --import tsx apps/desktop/scripts/retain-desktop-ci.ts
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified unsigned installer
        if: success() && inputs.signing == 'unsigned'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: ${{ steps.retained.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified signed installer
        if: success() && inputs.signing == 'signed'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-signed-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: ${{ steps.retained.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    # The fork publishes the retained build straight to a GitHub Release; upstream
    # routes publication through its self-hosted desktop-publish workflow with
    # approval Environments. Unsigned builds are marked prerelease, matching the
    # upstream caution against distributing unsigned installers.
    needs: package
    if: inputs.publish_release && needs.package.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
      RELEASE_TAG: v${{ needs.package.outputs.version }}
      RELEASE_SHA: ${{ needs.package.outputs.sha }}
      RELEASE_PRERELEASE: ${{ inputs.signing == 'unsigned' }}
    steps:
      - name: Download retained installer from this run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact }}
        run: gh run download ${{ github.run_id }} --name $env:ARTIFACT_NAME --dir retained --repo ${{ github.repository }}
      - name: Publish GitHub release
        working-directory: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $exe) { throw 'No installer executable in the retained build' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  $($exe.Name)" | Set-Content "$($exe.Name).sha256" -Encoding ascii
          $prerelease = @(); if ($env:RELEASE_PRERELEASE -eq 'true') { $prerelease += '--prerelease' }
          $notes = @"
          ## DSH Desktop $($env:RELEASE_VERSION) hardened（Windows x64）

          官方 ``deepseek-ai/deepseek-harness`` master + 去遥测加固提交构建；来源 commit ``$($env:RELEASE_SHA)``（分支 ``hardened``）。

          - 七条遥测/分析/搜索出境行在 profile 组装处强制禁用，任何用户层配置无法重新启用
          - 自动更新通道常闭；强制策略通道封存至 ``.invalid`` 死域
          - 未签名构建：SmartScreen 提示“未知发布者”属预期
          - SHA256: ``$hash``（随附 .sha256 校验文件）
          - 加固详情见仓库根 ``HARDENING.md``

          > Hardened build of the official DeepSeek Harness master: telemetry, analytics, and search egress rows are force-disabled at profile composition; update and policy channels are sealed. Unsigned — the SmartScreen warning is expected.
          "@
          gh release create $env:RELEASE_TAG "$($exe.Name)" "$($exe.Name).sha256" `
            --repo ${{ github.repository }} --target $env:RELEASE_SHA `
            --title "DSH Desktop $($env:RELEASE_VERSION) hardened (Windows x64, unsigned)" `
            --notes $notes $prerelease
